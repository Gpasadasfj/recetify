{% load static %}

<div class="flex justify-center mb-4">
  <button
    id="openDeleteModal"
    class="px-4 py-2 cursor-pointer bg-red-600 text-white rounded hover:bg-red-700"
  >
    Eliminar perfil
  </button>
  <div
    id="deleteModal"
    class="fixed inset-0 z-100 hidden items-center justify-center bg-black/50"
  >
    <div class="bg-white rounded-lg w-full max-w-md p-6">
      <h2 class="text-xl font-semibold mb-4">Eliminar perfil</h2>
      <p class="text-gray-600 mb-6">
        ¿Estás seguro de que quieres eliminar tu perfil? Perderas todas tus
        recetas y elementos guardados.
      </p>
      <div class="flex justify-end gap-3">
        <button
          id="closeDeleteModal"
          class="cursor-pointer px-4 py-2 bg-gray-200 rounded hover:bg-gray-300"
        >
          Cancelar
        </button>

        <form
          method="post"
          action="{% url 'profiles:delete_profile' object.pk %}"
        >
          {% csrf_token %}
          <button
            type="submit"
            class="cursor-pointer px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700"
          >
            Sí, eliminar
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="{% static 'js/delete_object_modal.js' %}" defer></script>
</div>
