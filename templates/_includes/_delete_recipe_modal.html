{% load static %}

<div class="bg-white flex justify-center pb-4">
  <button
          id="openDeleteModal"
          class="cursor-pointer py-2 w-full mx-4 font-bold bg-red-600 text-white rounded hover:bg-red-700"
          >
          Eliminar receta
      </button>

</div>
</div>
    <div
  id="deleteModal"
  class="fixed inset-0 z-100 hidden items-center justify-center bg-black/50"
>
  <div class="bg-white rounded-lg w-full max-w-md p-6">

    <h2 class="text-xl font-semibold mb-4">
      Eliminar receta
    </h2>

    <p class="text-gray-600 mb-6">
      ¿Estás seguro de que quieres eliminar la receta?
    </p>

    <div class="flex justify-end gap-3">
      <button
        id="closeDeleteModal"
        class="cursor-pointer px-4 py-2 bg-gray-200 rounded hover:bg-gray-300"
      >
        Cancelar
      </button>

      <form
        method="post"
        action="{% url 'recipes:delete_recipe' object.pk %}"
      >
        {% csrf_token %}
        <button
          type="submit"
          class="cursor-pointer px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700"
        >
          Sí, eliminar
        </button>
      </form>
    </div>

  </div>
</div>

<script src="{% static 'js/delete_object_modal.js' %}" defer></script>
