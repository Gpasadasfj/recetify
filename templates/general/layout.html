{% load static tailwind_tags %} 
<!doctype html>
<html class="no-js" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <script
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1"
      type="module"
    ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    />
    <link rel="icon" href="{% static 'favicon/favicon.ico' %}">
    <link rel="manifest" href="{% static 'favicon/manifest.json' %}">

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    {% tailwind_css %}
    <title>{% block head_title %}{% endblock %}</title>
  </head>
  <body class="body-bg md:pb-0 md:ml-[30dvw] xl:ml-[20dvw] 2xl:ml-0">
    <div
      class="{% if request.path != '/recipes/create/' and request.path != '/register/' and request.path != '/login/' %} 
      pb-25 {% endif %} min-h-dvh md:pb-0 xl:w-[80dvw] 2xl:mx-auto 2xl:flex 2xl:justify-center bg-(--bg-color) 2xl:w-[60dvw]"
    >
      {% include "_includes/_navbar.html" %}
      <div
        class="2xl:flex-col 2xl:flex 2xl:h-dvh 2xl:overflow-scroll 2xl:w-full"
      >
        <div>
          {% include "_includes/_header.html" %} 
          {% block page_content %} {% endblock page_content %}
        </div>
      </div>
    </div>
    <script
      src="{% static 'django-browser-reload/reload-listener.js' %}"
      defer
    ></script>
  </body>
</html>
